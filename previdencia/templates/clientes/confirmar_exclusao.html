{% extends "base.html" %}
{% block content %}<div class="page-header mb-4"><h1 class="h3 mb-1">Excluir cliente</h1><p class="text-muted mb-0">Esta ação não poderá ser desfeita.</p></div><div class="card content-card"><div class="card-body p-4"><p class="mb-4">Deseja realmente excluir <strong>{{ cliente.nome }}</strong> (CPF {{ cliente.cpf }})?</p><form method="post">{% csrf_token %}<a href="{% url 'clientes:lista' %}" class="btn btn-light">Cancelar</a><button type="submit" class="btn btn-danger ms-2"><i class="fa-solid fa-trash me-2"></i>Excluir cliente</button></form></div></div>{% endblock %}
