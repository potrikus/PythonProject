{% extends "base.html" %}
{% block content %}<div class="page-header mb-4"><h1 class="h3 mb-1">Excluir empresa</h1><p class="text-muted mb-0">Esta ação não poderá ser desfeita.</p></div><div class="card content-card"><div class="card-body p-4"><p class="mb-4">Deseja realmente excluir <strong>{{ empresa.razao_social }}</strong> (CNPJ {{ empresa.cnpj }})?</p><form method="post">{% csrf_token %}<a href="{% url 'empresas:lista' %}" class="btn btn-light">Cancelar</a><button type="submit" class="btn btn-danger ms-2"><i class="fa-solid fa-trash me-2"></i>Excluir empresa</button></form></div></div>{% endblock %}
